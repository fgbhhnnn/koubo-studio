name: desktop
# Koubo Studio desktop installers (Windows and macOS). This is not an official OpenFilm release:
# unsigned unless you later add Koubo signing secrets, and it never uses OpenFilm certificates or
# the openfilm.dev update feed.
#
# Triggers:
#   - push to main
#   - tag v* (must match apps/desktop/package.json version): also publishes a GitHub Release
#   - workflow_dispatch: build the current ref; optionally publish a GitHub Release
#
# Artifacts are always uploaded. Builds are unsigned and not notarized until KOUBO_SIGN_IDENTITY,
# APPLE_TEAM_ID and the related certificate secrets exist. Missing secrets must not fail the build.
# macOS: allow the app in System Settings → Privacy & Security (or Control-click → Open).
# Windows: SmartScreen may warn; choose More info → Run anyway.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also attach the installers to a GitHub Release (tag builds always do this)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish_release }}
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          TAG=""
          PUBLISH=false
          if [ "$EVENT" = push ] && [[ "$REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
            ASKED="${TAG#v}"
            if [ "$ASKED" != "$VERSION" ]; then
              echo "::error::$TAG does not match apps/desktop/package.json ($VERSION)"
              exit 1
            fi
            PUBLISH=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PUBLISH_INPUT" = true ]; then
            PUBLISH=true
          fi
          {
            echo "ref=$GITHUB_SHA"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Building Koubo Studio $VERSION (unsigned). Publish release: $PUBLISH"

  build:
    needs: plan
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, os: macos-15, args: --unsigned --arch=arm64, out: arm64 }
          - { target: mac-x64, os: macos-15, args: --unsigned --arch=x64, out: x64 }
          # NSIS, built on macOS as apps/desktop/scripts/release.mjs expects; not code-signed
          - { target: win-x64, os: macos-15, args: --unsigned --platform=win --arch=x64, out: win-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.target }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/koubo-python
          key: koubo-python-${{ matrix.target }}-${{ hashFiles('apps/desktop/src/python-runtime.mjs', 'apps/desktop/runtime/adu/requirements-runtime.txt') }}
          restore-keys: koubo-python-${{ matrix.target }}-
      - run: pnpm install --frozen-lockfile

      - name: Build unsigned Koubo Studio (${{ matrix.target }})
        working-directory: apps/desktop
        run: npm run release -- ${{ matrix.args }}

      - name: Check installers
        run: |
          set -euo pipefail
          out="apps/desktop/.release/${{ matrix.out }}/out"
          ls -la "$out"
          shopt -s nullglob
          files=("$out"/*.dmg "$out"/*.zip "$out"/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Koubo Studio installer found in $out"
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - name: Check bundled Python runtime
        run: node apps/desktop/scripts/check-staged-python.mjs "${{ matrix.target }}" "apps/desktop/.release/${{ matrix.out }}/runtime"

      - uses: actions/upload-artifact@v4
        with:
          name: koubo-studio-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/.release/${{ matrix.out }}/out/*.dmg
            apps/desktop/.release/${{ matrix.out }}/out/*.zip
            apps/desktop/.release/${{ matrix.out }}/out/*.exe
            apps/desktop/.release/${{ matrix.out }}/out/*.blockmap
            apps/desktop/.release/${{ matrix.out }}/out/latest*.yml

  github-release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: koubo-studio-*
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir upload
          for dir in artifacts/koubo-studio-*; do
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              cp "$f" upload/
            done
          done
          ls -l upload
          if [ -z "$(ls -A upload 2>/dev/null)" ]; then
            echo "::error::No installers to attach to the GitHub Release"
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## Koubo Studio ${VERSION}

          这是 **Koubo Studio** 的桌面安装包，不是 OpenFilm 官方发行。

          当前构建**未签名、未公证**（没有 Apple / Windows 代码签名证书时，CI 会打出未签名包，这是预期行为）：

          - **macOS**：首次打开可能提示无法验证开发者。请到「系统设置 → 隐私与安全性」允许打开，或按住 Control 点击图标选择「打开」。
          - **Windows**：SmartScreen 可能提示未经签名。请选择「更多信息」→「仍要运行」。

          Linux 安装包不是本工作流的必须产物。

          ---

          This is **Koubo Studio**, not an official OpenFilm release. These builds are **unsigned and not notarized**.

          - **macOS**: allow the app in System Settings → Privacy & Security, or Control-click the app and choose Open.
          - **Windows**: if SmartScreen appears, choose More info → Run anyway.
          NOTES
          # fill the version placeholder (the heredoc above is quoted)
          sed -i "s/\${VERSION}/$VERSION/g" notes.md

          if [ -n "$TAG" ]; then
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" upload/* --clobber
              gh release edit "$TAG" --notes-file notes.md --title "Koubo Studio $VERSION"
            else
              gh release create "$TAG" upload/* --verify-tag --title "Koubo Studio $VERSION" --notes-file notes.md
            fi
          else
            # workflow_dispatch without a version tag: rolling prerelease, not marked as latest
            REL_TAG="unsigned-dev"
            if gh release view "$REL_TAG" > /dev/null 2>&1; then
              gh release delete "$REL_TAG" --yes --cleanup-tag
            fi
            gh release create "$REL_TAG" upload/* --prerelease --latest=false --target "$SHA" \
              --title "Koubo Studio $VERSION 开发构建（未签名）" --notes-file notes.md
          fi
