<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Talking-head explainer preview">
  <defs>
    <radialGradient id="stage" cx="42%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#4a3f38"/>
      <stop offset="55%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10,10,12,0.55)"/>
      <stop offset="100%" stop-color="rgba(10,10,12,0.82)"/>
    </linearGradient>
    <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#stage)"/>
  <!-- stylized speaker -->
  <ellipse cx="360" cy="560" rx="220" ry="210" fill="#2a2420"/>
  <circle cx="360" cy="230" r="78" fill="#c4a894"/>
  <rect x="300" y="300" width="120" height="160" rx="60" fill="#c4a894"/>
  <rect x="250" y="330" width="220" height="210" rx="40" fill="#1a1715"/>
  <!-- illustration slot -->
  <g transform="translate(620 90)" filter="url(#shadow)">
    <rect width="260" height="200" rx="22" fill="#f6f4ee"/>
    <rect x="16" y="16" width="228" height="168" rx="14" fill="#e8e4d8"/>
    <rect x="40" y="128" width="90" height="10" rx="5" fill="#2462EA"/>
    <rect x="40" y="148" width="150" height="8" rx="4" fill="#b8b3a6"/>
    <circle cx="80" cy="80" r="28" fill="#2462EA" opacity="0.9"/>
    <path d="M72 80 l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="150" width="260" height="50" rx="22" fill="url(#cardFade)"/>
    <text x="18" y="182" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" font-weight="600" fill="#fff">方法</text>
  </g>
  <!-- caption bar -->
  <g filter="url(#shadow)">
    <rect x="48" y="392" width="864" height="108" rx="24" fill="url(#bar)"/>
  </g>
  <text x="80" y="458" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="42" font-weight="700" letter-spacing="0.02em">
    <tspan fill="#ffffff">今天我们来讲</tspan>
    <tspan dx="12" fill="#8cb4ff">三个方法</tspan>
    <tspan dx="12" fill="rgba(255,255,255,0.28)">就能提升</tspan>
  </text>
</svg>
