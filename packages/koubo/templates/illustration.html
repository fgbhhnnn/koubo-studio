<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=960, height=600">
<title>illustration</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #card {
    position: absolute; inset: 0;
    border-radius: 28px;
    overflow: hidden;
    background: #f6f4ee;
    box-shadow: 0 18px 50px rgba(0,0,0,.22);
    transform-origin: 50% 50%;
  }
  #card img, #card object, #card svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  #label {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 22px 20px;
    font: 600 28px/1.3 "PingFang SC", "Noto Sans SC", ui-sans-serif, sans-serif;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.62));
  }
</style>
</head>
<body>
<div id="card"><img id="pic" alt=""><div id="label"></div></div>
<script>
const Q = new URLSearchParams(location.search);
const src = Q.get('src') || '';
const label = Q.get('label') || '';
const pic = document.getElementById('pic');
const lab = document.getElementById('label');
if (src) pic.src = src;
lab.textContent = label;
function frame(t) {
  const fade = Math.max(0, Math.min(1, t / 0.28));
  const outStart = (window.film && window.film.duration ? window.film.duration - 0.28 : 1e9);
  const fadeOut = t > outStart ? Math.max(0, 1 - (t - outStart) / 0.28) : 1;
  const k = fade * fadeOut;
  const el = document.getElementById('card');
  el.style.opacity = String(k);
  el.style.transform = 'translateY(' + ((1 - k) * 24).toFixed(1) + 'px) scale(' + (0.96 + 0.04 * k).toFixed(3) + ')';
}
window.film = {
  duration: undefined,
  frame,
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
